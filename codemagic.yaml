# Codemagic build: turns this repo into an UNSIGNED .ipa on a cloud Mac.
# You never own a Mac — Codemagic rents you one per build. Signing is OFF here;
# SideStore signs on the iPhone afterwards with your free Apple ID.
#
# NOTE: `instance_type` and `xcode` values below are sensible defaults. If the
# first build errors on either, the log tells us the allowed value and we swap it.
workflows:
  ios-unsigned:
    name: Blazify iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate the Xcode project
        script: xcodegen generate

      - name: Build unsigned .app
        script: |
          # The whole log goes to a file and only a digest reaches the console.
          # xcodebuild echoes its entire command line — every source path, every
          # module — for each compile, which is tens of thousands of characters
          # of noise. The log viewer then shows "the last 50 lines", all of
          # which are that echo, and the three lines that say what is actually
          # wrong scroll away above it. Compiler diagnostics are the point of a
          # failed build; they should not be the hardest thing to find in it.
          set -o pipefail
          xcodebuild \
            -project BlazifyPlayer.xcodeproj \
            -scheme BlazifyPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?

          if [ $status -ne 0 ]; then
            echo ""
            echo "======================= ERRORS ======================="
            # Diagnostics only: file, line, and what is wrong. Two lines of
            # context after each, which is where the offending source line and
            # the caret marker live.
            grep -n -A 2 -E "(error|warning): " xcodebuild.log \
              | grep -v "^.*note: " \
              | head -120 \
              || echo "(no diagnostics found — see the xcodebuild.log artifact)"
            echo "======================================================"
            echo ""
          fi
          exit $status

      - name: Fix __LINKEDIT so third-party signing survives (iOS dyld launch fix)
        script: |
          APP=build/Build/Products/Release-iphoneos/BlazifyPlayer.app
          # The app binary AND every extension inside it. A widget's .appex is
          # its own Mach-O — leaving it unpatched crashes the app at launch with
          # the same __LINKEDIT error, and it is not obvious where from.
          BINARIES="$APP/BlazifyPlayer"
          for ext in "$APP"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            BINARIES="$BINARIES $ext/$(basename "$ext" .appex)"
          done
          echo "Patching: $BINARIES"
          python3 scripts/fix_linkedit.py $BINARIES

      - name: Package into an .ipa
        script: |
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R BlazifyPlayer.app Payload/
          zip -r "$CM_BUILD_DIR/BlazifyPlayer.ipa" Payload
    artifacts:
      - BlazifyPlayer.ipa
      # Kept whatever happens, so a failure can be read in full rather than
      # through a console that truncates.
      - xcodebuild.log
