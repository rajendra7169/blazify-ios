# XcodeGen spec. There is no Mac here to create an .xcodeproj by hand, so
# Codemagic runs `xcodegen generate` on its cloud Mac to build this file into a
# real project before compiling. Edit this, never the generated .xcodeproj.
name: BlazifyPlayer
options:
  bundleIdPrefix: com.rajendra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BlazifyPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      # The .lproj folders must go in as folder references, or Xcode flattens
      # them and every language resolves to the same file.
      - path: Sources/en.lproj
        type: folder
      - path: Sources/ne.lproj
        type: folder
      - path: Sources/hi.lproj
        type: folder
    dependencies:
      - target: BlazifyWidget
        embed: true
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Blazify
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ne, hi]
        # The one line that lets a music player keep going with the screen locked.
        UIBackgroundModes:
          - audio
        # Song recognition listens on the mic (ShazamKit). iOS kills the app on
        # the spot if it records without this string.
        NSMicrophoneUsageDescription: Blazify uses the microphone to recognise the song playing around you.
        CFBundleURLTypes:
          - CFBundleURLName: com.rajendra.blazifyplayer
            CFBundleURLSchemes:
              - blazify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajendra.blazifyplayer
        CODE_SIGN_ENTITLEMENTS: Blazify.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BlazifyWidget:
    type: app-extension
    platform: iOS
    # The widget shares only what it must: the deep-link URLs, the now-playing
    # snapshot it reads, and the transport intents its buttons run. Blazify's
    # own App Intents stay in the app — compiling those here too would register
    # every Siri phrase twice.
    sources:
      - Widget
      - path: Sources/BlazifyLink.swift
      - path: Sources/NowPlayingShare.swift
      - path: Sources/WidgetTransport.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Blazify
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajendra.blazifyplayer.widget
        CODE_SIGN_ENTITLEMENTS: BlazifyWidget.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
