# XcodeGen spec. There is no Mac here to create an .xcodeproj by hand, so
# Codemagic runs `xcodegen generate` on its cloud Mac to build this file into a
# real project before compiling. Edit this, never the generated .xcodeproj.
name: BlazifyPlayer
options:
  bundleIdPrefix: com.rajendra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BlazifyPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: BlazifyWidget
        embed: true
    info:
      path: Sources/Generated-Info.plist
      properties:
        CFBundleDisplayName: Blazify
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # The one line that lets a music player keep going with the screen locked.
        UIBackgroundModes:
          - audio
        # Song recognition listens on the mic (ShazamKit). iOS kills the app on
        # the spot if it records without this string.
        NSMicrophoneUsageDescription: Blazify uses the microphone to recognise the song playing around you.
        CFBundleURLTypes:
          - CFBundleURLName: com.rajendra.blazifyplayer
            CFBundleURLSchemes:
              - blazify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajendra.blazifyplayer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BlazifyWidget:
    type: app-extension
    platform: iOS
    # Only the link definitions are shared, so the widget and the app can't
    # drift on URLs. The intents themselves stay in the app — compiling them
    # here too would register every App Intent twice.
    sources:
      - Widget
      - path: Sources/BlazifyLink.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Blazify
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajendra.blazifyplayer.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
